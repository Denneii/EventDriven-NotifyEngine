name: CI Pipeline - EventDriven NotifyEngine

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test Java Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup do Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: |
            notify-api/pom.xml
            notify-worker/pom.xml

      - name: Build e Testes - Notify API
        working-directory: notify-api
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Build e Testes - Notify Worker
        working-directory: notify-worker
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Build Docker Image - API
        run: docker build -t notify-api:latest ./notify-api

      - name: Build Docker Image - Worker
        run: docker build -t notify-worker:latest ./notify-worker